<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="/static/css/encoder.css?">
    <link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&display=swap" rel="stylesheet">
</head>
<body>
<div class="terminal">
    <div class ="homeicon">
        <a href="/" class="vault-button">
            <img src="/static/image/homeicon.png" alt="Vault Boy">
        </a>
    </div>

    <h1>
        ROBCO INDUSTRIES UNIFIED OPERATING SYSTEM
    </h1>

    <h1>
        COPYRIGHT 2075-2077 ROBCO INDUSTRIES
    </h1>

    <h1>
        -SERVER 76-
    </h1>

    

    <div class="monitor"> 
        <div class="monitor_header">
            <h2>
                -ASCII-ART ENCODING SYSTEM-
            </h2>
            <h2>
                ===========================
            </h2>
            <form action="/encoder" method="POST">
                <textarea name="input">{{.Input}}</textarea><br>
                <button class="main_but" type="submit">>>Encode</button>
            </form>
        </div>

        <div class ="result_block">
            {{if .Result}}
                <h2>Result:</h2>
                <h2>===========================</h2>
                <pre>{{.Result}}</pre>
            {{end}}
        </div>
    </div>



</div>
</body>
</html>
