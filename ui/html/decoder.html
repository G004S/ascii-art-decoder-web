<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="/static/css/decoder.css?">
    <link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&display=swap" rel="stylesheet">
</head>
<body>
<div class="terminal">
    <div class ="header">
        <div class="homeicon">
            <a href="/" class="home-button">
                 <button class="vault-button" type="home">
                    <img src="/static/image/yellowhomeicon.png" alt="Vault Boy">
                 </button>
            </a>
        </div>
    
        <div class="headertext">
            <h1>
                ROBCO INDUSTRIES UNIFIED OPERATING SYSTEM
            </h1>

            <h1>
                COPYRIGHT 2075-2077 ROBCO INDUSTRIES
            </h1>

            <h1>
                -SERVER 76-
            </h1>
        </div>
    </div>
    

    <div class="monitor"> 
        <div class="monitor_header">
            <h2>
                -ASCII-ART DECODING SYSTEM-
            </h2>
            <h2>
                ===========================
            </h2>
            <form action="/decoder" method="POST">
                <textarea name="input">{{.Input}}</textarea><br>
                <button class="main_but" type="submit">>>Decode</button>
            </form>
        </div>

        <div class ="result_block">
            {{if .Result}}
                <h2>Result:</h2>
                <pre>{{.Result}}</pre>
            {{end}}
        </div>
    </div>



</div>
</body>
</html>
